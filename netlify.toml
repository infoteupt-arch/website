# TEU — Netlify configuration
# Static site, no build step, no dependencies. Every page is a FILE AT THE ROOT,
# so it is served even if this file is ignored entirely. The rules below only add
# the pretty URLs on top; nothing depends on them.

[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/index.dc.html"
  status = 200

[[redirects]]
  from = "/produtos"
  to = "/produtos.dc.html"
  status = 200

[[redirects]]
  from = "/sobre"
  to = "/sobre.dc.html"
  status = 200

[[redirects]]
  from = "/encomendas"
  to = "/encomendas.dc.html"
  status = 200

[[redirects]]
  from = "/catalogo"
  to = "/catalogo.dc.html"
  status = 200

[[redirects]]
  from = "/produto/maracuja"
  to = "/produto-maracuja.dc.html"
  status = 200

[[redirects]]
  from = "/produto/pessego"
  to = "/produto-pessego.dc.html"
  status = 200

[[redirects]]
  from = "/produto/manga"
  to = "/produto-manga.dc.html"
  status = 200

[[redirects]]
  from = "/produto/morango"
  to = "/produto-morango.dc.html"
  status = 200

[[redirects]]
  from = "/produto/tangerina"
  to = "/produto-tangerina.dc.html"
  status = 200

[[redirects]]
  from = "/produto/coco"
  to = "/produto-coco.dc.html"
  status = 200

[[redirects]]
  from = "/produto/framboesa"
  to = "/produto-framboesa.dc.html"
  status = 200

[[redirects]]
  from = "/produto/cereja"
