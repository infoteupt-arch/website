# TEU — Netlify configuration
# Static site, no build step. Pretty URLs are exact-match rewrites only:
# a wildcard like "/produto/:slug" would also capture "/produto/maracuja.dc.html"
# and rewrite it to ".dc.html.dc.html", which 404s. Do not reintroduce it.

[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/index.dc.html"
  status = 200

[[redirects]]
  from = "/produtos"
  to = "/produtos.dc.html"
  status = 200

[[redirects]]
  from = "/sobre"
  to = "/sobre.dc.html"
  status = 200

[[redirects]]
  from = "/encomendas"
  to = "/encomendas.dc.html"
  status = 200

[[redirects]]
  from = "/catalogo"
  to = "/catalogo.dc.html"
  status = 200

[[redirects]]
  from = "/produto/maracuja"
  to = "/produto/maracuja.dc.html"
  status = 200

[[redirects]]
  from = "/produto/pessego"
  to = "/produto/pessego.dc.html"
  status = 200

[[redirects]]
  from = "/produto/manga"
  to = "/produto/manga.dc.html"
  status = 200

[[redirects]]
  from = "/produto/morango"
  to = "/produto/morango.dc.html"
  status = 200

[[redirects]]
  from = "/produto/tangerina"
  to = "/produto/tangerina.dc.html"
  status = 200

[[redirects]]
  from = "/produto/coco"
  to = "/produto/coco.dc.html"
  status = 200

[[redirects]]
  from = "/produto/framboesa"
  to = "/produto/framboesa.dc.html"
  status = 200

[[redirects]]
  from = "/produto/cereja"
  to = "/produto/cereja.dc.html"
  status = 200

[[redirects]]
  from = "/produto/goiaba"
  to = "/produto/goiaba.dc.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
