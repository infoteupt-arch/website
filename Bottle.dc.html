<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
</helmet>
<svg ref="{{ svgRef }}" viewBox="0 0 260 700" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="{{ aria }}" style="display:block;overflow:visible">
  <defs>
    <clipPath id="{{ idOuter }}">
      <path d="M86,80 L86,145 C86,180 30,205 30,235 L30,600 C30,610 40,616 54,616 L206,616 C220,616 230,610 230,600 L230,235 C230,205 174,180 174,145 L174,80 Z"></path>
    </clipPath>
    <clipPath id="{{ idInner }}">
      <path d="M91,86 L91,145 C91,180 35,205 35,235 L35,596 C35,604 44,610 56,610 L204,610 C216,610 225,604 225,596 L225,235 C225,205 169,180 169,145 L169,86 Z"></path>
    </clipPath>
    <clipPath id="{{ idLabel }}"><rect x="30" y="300" width="200" height="233"></rect></clipPath>

    <linearGradient id="{{ idLiq }}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="{{ liqTop }}"></stop>
      <stop offset="55%" stop-color="{{ liqMid }}"></stop>
      <stop offset="100%" stop-color="{{ liqBot }}"></stop>

    <radialGradient id="{{ idLiqGlow }}" cx="34%" cy="12%" r="62%">

      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="{{ idCurve }}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.88"></stop>
      <stop offset="5%" stop-color="#000" stop-opacity="0.48"></stop>
      <stop offset="14%" stop-color="#000" stop-opacity="0.06"></stop>
      <stop offset="50%" stop-color="#000" stop-opacity="0"></stop>
      <stop offset="84%" stop-color="#000" stop-opacity="0.10"></stop>
      <stop offset="95%" stop-color="#000" stop-opacity="0.55"></stop>
      <stop offset="100%" stop-color="#000" stop-opacity="0.9"></stop>
    </linearGradient>
    <linearGradient id="{{ idGlass }}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1310"></stop>
      <stop offset="16%" stop-color="#1c2622"></stop>
      <stop offset="50%" stop-color="#121a17"></stop>
      <stop offset="86%" stop-color="#1a2420"></stop>
      <stop offset="100%" stop-color="#0b100e"></stop>
    </linearGradient>
    <linearGradient id="{{ idSteel }}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b3b3d"></stop>
      <stop offset="22%" stop-color="#e6e7e9"></stop>
      <stop offset="42%" stop-color="#8d8f93"></stop>
      <stop offset="62%" stop-color="#cfd1d4"></stop>
      <stop offset="85%" stop-color="#6a6c70"></stop>
      <stop offset="100%" stop-color="#303032"></stop>
    </linearGradient>
    <linearGradient id="{{ idCap }}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8b2a6"></stop>
      <stop offset="18%" stop-color="#f4f1ea"></stop>
      <stop offset="46%" stop-color="#e2ded4"></stop>
      <stop offset="74%" stop-color="#cbc5b8"></stop>
      <stop offset="100%" stop-color="#9d978b"></stop>
    </linearGradient>
    <linearGradient id="{{ idLabelBg }}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"></stop>
      <stop offset="12%" stop-color="#050505"></stop>
      <stop offset="46%" stop-color="#0c0b0a"></stop>
      <stop offset="62%" stop-color="#0d0c0a"></stop>
      <stop offset="90%" stop-color="#020202"></stop>
      <stop offset="100%" stop-color="#000000"></stop>
    </linearGradient>
    <linearGradient id="{{ idFade }}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.20"></stop>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"></stop>
    </linearGradient>
    <filter id="{{ idBlur }}" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"></feGaussianBlur>
    </filter>
    <filter id="{{ idSoft }}" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5"></feGaussianBlur>
    </filter>
  </defs>

    <ellipse cx="130" cy="175" rx="56" ry="7" fill="#fff" opacity="0.20"></ellipse>
    <ellipse cx="130" cy="176.5" rx="56" ry="6" fill="{{ liqTop }}"></ellipse>

      <ellipse cx="106" cy="206" rx="5" ry="3.4" transform="rotate(14 106 206)"></ellipse>

      <ellipse cx="86" cy="258" rx="5.4" ry="3.6" transform="rotate(-31 86 258)"></ellipse>
      <ellipse cx="122" cy="244" rx="5" ry="3.5" transform="rotate(6 122 244)"></ellipse>
      <ellipse cx="158" cy="266" rx="5.6" ry="3.8" transform="rotate(-15 158 266)"></ellipse>

      <ellipse cx="56" cy="264" rx="5.2" ry="3.5" transform="rotate(-26 56 264)"></ellipse>
      <ellipse cx="100" cy="278" rx="5" ry="3.5" transform="rotate(3 100 278)"></ellipse>
      <ellipse cx="140" cy="292" rx="5.4" ry="3.6" transform="rotate(18 140 292)"></ellipse>
      <ellipse cx="178" cy="284" rx="4.6" ry="3.2" transform="rotate(-12 178 284)"></ellipse>
      <ellipse cx="210" cy="266" rx="4.6" ry="3.2" transform="rotate(34 210 266)"></ellipse>
      <ellipse cx="66" cy="296" rx="5" ry="3.4" transform="rotate(-17 66 296)"></ellipse>
      <ellipse cx="196" cy="298" rx="4.8" ry="3.3" transform="rotate(11 196 298)"></ellipse>
    </g>
  </g>

  <g clip-path="url(#{{ idLabel }})">
    <rect x="30" y="300" width="200" height="233" fill="url(#{{ idLabelBg }})"></rect>
    <rect x="30" y="300" width="200" height="1.2" fill="#fff" opacity="0.14"></rect>
    <rect x="30" y="531.8" width="200" height="1.2" fill="#000" opacity="0.6"></rect>

    <rect x="30" y="314.4" width="200" height="1.4" fill="{{ accent }}"></rect>
    <rect x="30" y="317.8" width="200" height="0.5" fill="#7E623A"></rect>
    <rect x="30" y="514.2" width="200" height="0.5" fill="#7E623A"></rect>
    <rect x="30" y="516.6" width="200" height="1.4" fill="{{ accent }}"></rect>

    <text x="130" y="366" text-anchor="middle" font-family="Manrope, sans-serif" font-size="5" font-weight="500" letter-spacing="2.1" fill="#C6A468">PREMIUM</text>
    <text x="135.5" y="406.5" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="40" letter-spacing="11" fill="#AF8C56">TEU</text>
    <text data-slot="name" x="130" y="452" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="13.6" fill="#AF8C56"></text>
    <text data-slot="conc" x="131.3" y="468" text-anchor="middle" font-family="Manrope, sans-serif" font-size="5" font-weight="500" letter-spacing="2.5" fill="#AF8C56"></text>
    <text data-slot="fresh" x="131" y="512.7" text-anchor="middle" font-family="Manrope, sans-serif" font-size="4.7" font-weight="400" letter-spacing="1.9" fill="#C6A468"></text>
  </g>

  <g clip-path="url(#{{ idOuter }})">
    <rect x="20" y="60" width="220" height="570" fill="url(#{{ idCurve }})"></rect>
    <rect x="44" y="240" width="13" height="356" rx="6.5" fill="#fff" opacity="0.30" filter="url(#{{ idSoft }})"></rect>
    <rect x="47" y="246" width="5.5" height="344" rx="2.8" fill="#fff" opacity="0.62"></rect>
    <rect x="64" y="256" width="3" height="328" rx="1.5" fill="#fff" opacity="0.16"></rect>
    <rect x="206" y="262" width="6" height="316" rx="3" fill="#fff" opacity="0.16" filter="url(#{{ idSoft }})"></rect>
    <rect x="212" y="272" width="2.2" height="296" rx="1.1" fill="#fff" opacity="0.26"></rect>
    <path d="M42,238 C52,200 86,182 86,145 L94,145 C94,190 60,212 52,242 Z" fill="#fff" opacity="0.20"></path>
    <ellipse cx="130" cy="604" rx="94" ry="16" fill="#fff" opacity="0.10"></ellipse>
    <ellipse cx="130" cy="609" rx="70" ry="7" fill="#fff" opacity="0.14"></ellipse>
    <rect x="30" y="590" width="200" height="4" fill="#000" opacity="0.35"></rect>
  </g>

  <path d="M86,80 L86,145 C86,180 30,205 30,235 L30,600 C30,610 40,616 54,616 L206,616 C220,616 230,610 230,600 L230,235 C230,205 174,180 174,145 L174,80 Z"
        fill="none" stroke="#cfd8d2" stroke-opacity="0.34" stroke-width="1.5"></path>

  <path d="M91,86 L91,145 C91,180 35,205 35,235 L35,596" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="1.1"></path>

  <g>
    <rect x="82" y="58" width="96" height="22" rx="4" fill="url(#{{ idGlass }})"></rect>
    <rect x="82" y="58" width="96" height="22" rx="4" fill="url(#{{ idCurve }})"></rect>
    <rect x="82" y="58" width="96" height="22" rx="4" fill="none" stroke="#cfd8d2" stroke-opacity="0.26" stroke-width="1.3"></rect>
    <rect x="90" y="61" width="6" height="16" rx="3" fill="#fff" opacity="0.5"></rect>
    <rect x="166" y="62" width="3" height="14" rx="1.5" fill="#fff" opacity="0.2"></rect>
    <ellipse cx="130" cy="59" rx="48" ry="5" fill="#0e1512" stroke="#cfd8d2" stroke-opacity="0.24" stroke-width="1"></ellipse>
  </g>

  <g>
    <rect x="94" y="54" width="72" height="10" rx="3" fill="#e9dcc6"></rect>
    <rect x="94" y="54" width="72" height="10" rx="3" fill="url(#{{ idCurve }})" opacity="0.55"></rect>
    <path d="M87,34 C87,24 101,19 130,19 C159,19 173,24 173,34 L173,52 C173,58 159,62 130,62 C101,62 87,58 87,52 Z" fill="url(#{{ idCap }})"></path>
    <path d="M87,34 C87,24 101,19 130,19 C159,19 173,24 173,34 C173,41 159,45 130,45 C101,45 87,41 87,34 Z" fill="#fbf9f4" opacity="0.55"></path>
    <ellipse cx="113" cy="29" rx="19" ry="7" fill="#fff" opacity="0.55"></ellipse>
    <ellipse cx="110" cy="26" rx="10" ry="4" fill="#fff" opacity="0.6"></ellipse>
    <path d="M87,34 C87,24 101,19 130,19 C159,19 173,24 173,34 L173,52 C173,58 159,62 130,62 C101,62 87,58 87,52 Z" fill="none" stroke="#8e887c" stroke-opacity="0.5" stroke-width="1"></path>
    <path d="M91,48 C105,53 155,53 169,48" fill="none" stroke="#a29b8d" stroke-opacity="0.45" stroke-width="0.9"></path>
  </g>

  <g fill="none" stroke="url(#{{ idSteel }})" stroke-linecap="round">
    <path d="M85,42 C85,10 175,10 175,42" stroke-width="4.2"></path>
    <path d="M87,40 C89,18 171,18 173,40" stroke-width="1.1" stroke="#fff" stroke-opacity="0.4"></path>
    <path d="M85,42 C83,66 80,88 80,116" stroke-width="4"></path>
    <path d="M175,42 C177,66 180,88 180,116" stroke-width="4"></path>
    <path d="M80,116 C80,130 98,136 106,133" stroke-width="3.4"></path>
    <path d="M180,116 C180,130 162,136 154,133" stroke-width="3.4"></path>
    <path d="M78,112 C92,128 168,128 182,112" stroke-width="3.6"></path>
    <path d="M80,113 C94,125 166,125 180,113" stroke-width="1" stroke="#fff" stroke-opacity="0.45"></path>
  </g>
  <circle cx="85" cy="42" r="3.4" fill="#b9bbbe" stroke="#5c5e61" stroke-width="0.8"></circle>
  <circle cx="175" cy="42" r="3.4" fill="#b9bbbe" stroke="#5c5e61" stroke-width="0.8"></circle>

  <g opacity="0.08" clip-path="url(#{{ idOuter }})">
    <rect x="30" y="300" width="200" height="233" fill="url(#{{ idFade }})"></rect>
  </g>
</svg>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:740},&quot;flavour&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;maracuja&quot;,&quot;pessego&quot;,&quot;manga&quot;,&quot;morango&quot;,&quot;tangerina&quot;,&quot;coco&quot;,&quot;framboesa&quot;,&quot;cereja&quot;,&quot;goiaba&quot;],&quot;default&quot;:&quot;maracuja&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pt&quot;,&quot;en&quot;],&quot;default&quot;:&quot;pt&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pct&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[100,70,50,30],&quot;default&quot;:100,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[200,500,1000],&quot;default&quot;:1000,&quot;tsType&quot;:&quot;number&quot;}}">
const DATA = {
  maracuja:  { pt:'Maracujá',  en:'Passion fruit', accent:'#F2D94B', liq:['#F9BC3A','#F0951E','#C85E10'], seeds:1 },
  pessego:   { pt:'Pêssego',   en:'Peach',         accent:'#F9906F', liq:['#F2BE85','#E2A05A','#C97B33'] },
  manga:     { pt:'Manga',     en:'Mango',         accent:'#F0B323', liq:['#FBD152','#F0B324','#D28C0C'] },
  morango:   { pt:'Morango',   en:'Strawberry',    accent:'#C94F56', liq:['#DC5468','#BE2439','#7E0C1E'] },
  tangerina: { pt:'Tangerina', en:'Tangerine',     accent:'#F2670D', liq:['#FBA34A','#EE7B22','#CB520C'] },
  coco:      { pt:'Coco',      en:'Coconut',       accent:'#CBB89A', liq:['#FAF6EC','#EDE6D8','#D6CCB8'] },
  framboesa: { pt:'Framboesa', en:'Raspberry',     accent:'#D61F3F', liq:['#D05C88','#B33465','#7A1642'] },
  cereja:    { pt:'Cereja',    en:'Cherry',        accent:'#A02A3C', liq:['#AC3040','#82182A','#4A0C17'] },
  goiaba:    { pt:'Goiaba',    en:'Guava',         accent:'#D96A75', liq:['#F49277','#E06450','#B93C2F'] }
};

class Component extends DCLogic {
  svgRef = React.createRef();
  paint() {
    const r = this.svgRef.current;
    if (!r || !this._txt) return;
    for (const k in this._txt) {
      const el = r.querySelector('[data-slot="' + k + '"]');
      if (el) el.textContent = this._txt[k];
    }
  }
  componentDidMount() { this.paint(); }
  componentDidUpdate() { this.paint(); }
  renderVals() {
    const slug = this.props.flavour || 'maracuja';
    const f = DATA[slug] || DATA.maracuja;
    const lang = this.props.lang === 'en' ? 'en' : 'pt';
    const pct = this.props.pct || 100;
    const size = Number(this.props.size) || 1000;
    const sizeLabel = size >= 1000 ? '1 L' : size + ' ml';
    const name = f[lang];
    const u = (lang === 'en' ? 'CONCENTRATE · ' + f.en : 'CONCENTRADO DE ' + f.pt).toUpperCase();
    this._txt = {
      conc: u, name,
      fresh: (lang === 'en' ? pct + '% fresh fruit · ' : pct + '% fruta fresca · ') + sizeLabel
    };
    Promise.resolve().then(() => this.paint());
    return {
      svgRef: this.svgRef,
      idOuter: 'o-' + slug, idInner: 'i-' + slug, idLabel: 'l-' + slug,
      idLiq: 'lq-' + slug, idLiqGlow: 'lg-' + slug, idCurve: 'cv-' + slug,
      idGlass: 'gl-' + slug, idSteel: 'st-' + slug, idCap: 'cp-' + slug,
      idLabelBg: 'lb-' + slug, idFade: 'fd-' + slug,
      idBlur: 'bl-' + slug, idSoft: 'sf-' + slug,
      accent: f.accent,
      liqTop: f.liq[0], liqMid: f.liq[1], liqBot: f.liq[2],
      seedOpacity: f.seeds ? 0.62 : 0,
      aria: (lang === 'en' ? 'TEU ' + f.en + ' concentrate, 1 litre bottle' : 'Garrafa de concentrado TEU de ' + f.pt + ', 1 litro')
    };
  }
}

</script>
</body>
</html>
