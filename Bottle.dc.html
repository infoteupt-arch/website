    <linearGradient id="{{ idCap }}" x1="0" y1="0" x2="1" y2="0">

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:760},&quot;flavour&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;maracuja&quot;,&quot;pessego&quot;,&quot;manga&quot;,&quot;morango&quot;,&quot;tangerina&quot;,&quot;coco&quot;,&quot;framboesa&quot;,&quot;cereja&quot;,&quot;goiaba&quot;],&quot;default&quot;:&quot;maracuja&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pt&quot;,&quot;en&quot;],&quot;default&quot;:&quot;pt&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pct&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[100,70,50,30],&quot;default&quot;:100,&quot;tsType&quot;:&quot;number&quot;}}">
const DATA = {
  maracuja:  { pt:'Maracujá',  en:'Passion fruit', accent:'#D9A036', liq:['#F9BC3A','#F0951E','#C85E10'], seeds:1 },
  pessego:   { pt:'Pêssego',   en:'Peach',         accent:'#EFA46B', liq:['#F2BE85','#E2A05A','#C97B33'] },
  manga:     { pt:'Manga',     en:'Mango',         accent:'#F0B03A', liq:['#FBD152','#F0B324','#D28C0C'] },
  morango:   { pt:'Morango',   en:'Strawberry',    accent:'#C9364A', liq:['#DC5468','#BE2439','#7E0C1E'] },
  tangerina: { pt:'Tangerina', en:'Tangerine',     accent:'#E88434', liq:['#FBA34A','#EE7B22','#CB520C'] },
  coco:      { pt:'Coco',      en:'Coconut',       accent:'#E3D8C2', liq:['#FAF6EC','#EDE6D8','#D6CCB8'] },
  framboesa: { pt:'Framboesa', en:'Raspberry',     accent:'#B23A6B', liq:['#D05C88','#B33465','#7A1642'] },
  cereja:    { pt:'Cereja',    en:'Cherry',        accent:'#7E1F2E', liq:['#AC3040','#82182A','#4A0C17'] },
  goiaba:    { pt:'Goiaba',    en:'Guava',         accent:'#E56A57', liq:['#F49277','#E06450','#B93C2F'] }
};

class Component extends DCLogic {
  svgRef = React.createRef();
  paint() {
    const r = this.svgRef.current;
    if (!r || !this._txt) return;
    for (const k in this._txt) {
      const el = r.querySelector('[data-slot="' + k + '"]');
      if (el) el.textContent = this._txt[k];
    }
  }
  componentDidMount() { this.paint(); }
  componentDidUpdate() { this.paint(); }
  renderVals() {
    const slug = this.props.flavour || 'maracuja';
    const f = DATA[slug] || DATA.maracuja;
    const lang = this.props.lang === 'en' ? 'en' : 'pt';
    const pct = this.props.pct || 100;
    const name = f[lang];
    const u = (lang === 'en' ? 'CONCENTRATE · ' + f.en : 'CONCENTRADO DE ' + f.pt).toUpperCase();
    this._txt = {
      conc: u, name,
      fresh: lang === 'en' ? pct + '% fresh fruit · 1 L' : pct + '% fruta fresca · 1 L'
    };
    Promise.resolve().then(() => this.paint());
    return {
      svgRef: this.svgRef,
      idOuter: 'o-' + slug, idInner: 'i-' + slug, idLabel: 'l-' + slug,
      idLiq: 'lq-' + slug, idLiqGlow: 'lg-' + slug, idCurve: 'cv-' + slug,
      idGlass: 'gl-' + slug, idSteel: 'st-' + slug, idCap: 'cp-' + slug,
      idLabelBg: 'lb-' + slug, idFade: 'fd-' + slug,
      idBlur: 'bl-' + slug, idSoft: 'sf-' + slug,
      accent: f.accent,
      liqTop: f.liq[0], liqMid: f.liq[1], liqBot: f.liq[2],
      seedOpacity: f.seeds ? 0.62 : 0,
      aria: (lang === 'en' ? 'TEU ' + f.en + ' concentrate, 1 litre bottle' : 'Garrafa de concentrado TEU de ' + f.pt + ', 1 litro')
    };
  }
}

</script>
</body>
</html>
